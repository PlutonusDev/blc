<!doctype html>
<!--
  Brothers Leagues Clubs email signature.

  HOW TO INSTALL IN GMAIL
  1. Open this file in a browser.
  2. Select everything on the page (Ctrl+A / Cmd+A) and copy (Ctrl+C / Cmd+C).
  3. Gmail > Settings > See all settings > General > Signature > Create new.
  4. Paste into the signature box. Do not use "Paste as plain text".
  5. Set the signature for new mail and replies, then Save Changes at the bottom.

  NOTE ON THE LOGO
  The image is loaded from https://www.brothersleagues.com.au/email/brothers-signature.png
  It will only appear once the site is live at that domain. Until then Gmail
  shows a broken image. To test before launch, change the src below to any
  publicly reachable URL hosting the same file.

  TO MAKE ONE FOR SOMEONE ELSE
  Change the four marked fields: name, role, email (twice, in href and text)
  and phone (twice, in href and text). Everything else stays the same.
-->
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>Email signature, Jason Matthison</title>
  </head>
  <body style="margin: 0; padding: 24px; background: #ffffff">
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif"
    >
      <tr>
        <!-- Logo -->
        <td valign="top" style="padding: 0 22px 0 0">
          <a href="https://www.brothersleagues.com.au" style="text-decoration: none">
            <img
              src="https://www.brothersleagues.com.au/email/brothers-signature.png"
              alt="Brothers Leagues Clubs"
              width="150"
              height="35"
              style="display: block; width: 150px; height: 35px; border: 0; outline: none"
            />
          </a>
        </td>

        <!-- Gold rule -->
        <td
          valign="top"
          width="1"
          style="width: 1px; background-color: #c5a25c; font-size: 0; line-height: 0"
        >
          &nbsp;
        </td>

        <!-- Details -->
        <td valign="top" style="padding: 0 0 0 22px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="border-collapse: collapse"
          >
            <tr>
              <td
                style="
                  font-family: Georgia, 'Times New Roman', serif;
                  font-size: 17px;
                  line-height: 22px;
                  font-weight: bold;
                  color: #0d183f;
                  padding: 0 0 3px;
                "
              >
                <!-- NAME -->
                Jason Matthison
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 10px;
                  line-height: 15px;
                  font-weight: bold;
                  letter-spacing: 1.6px;
                  color: #8f7133;
                  padding: 0 0 10px;
                "
              >
                <!-- ROLE -->
                VENUE MANAGER
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 12px;
                  line-height: 18px;
                  color: #4a5266;
                  padding: 0 0 10px;
                "
              >
                Brothers Leagues Club Cairns
              </td>
            </tr>
            <tr>
              <td style="border-top: 1px solid #e2d9c5; font-size: 0; line-height: 0; padding: 0">
                &nbsp;
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 12px;
                  line-height: 20px;
                  color: #4a5266;
                  padding: 10px 0 0;
                "
              >
                <a
                  href="mailto:cairns@brothersleagues.com.au"
                  style="color: #0d183f; text-decoration: none"
                  >cairns@brothersleagues.com.au</a
                ><br />
                <a href="tel:+61461000000" style="color: #0d183f; text-decoration: none"
                  >0461 000 000</a
                ><br />
                99-107 Anderson Street, Manunda QLD 4870
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-family: Arial, Helvetica, sans-serif;
                  font-size: 10px;
                  line-height: 15px;
                  font-weight: bold;
                  letter-spacing: 1.4px;
                  padding: 10px 0 0;
                "
              >
                <a
                  href="https://www.brotherscairns.com.au"
                  style="color: #8f7133; text-decoration: none"
                  >brotherscairns.com.au</a
                >
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
